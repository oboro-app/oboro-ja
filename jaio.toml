# jaio の解析設定。スキーマは docs/design.md §8 を参照。
# テスト用 fixture は解析対象から除外する
[paths]
exclude = [
  "crates/jaio-rules/tests/fixtures",
  # ログ置き場(解析対象外)
  "logs",
]
# 隠しエントリ(.oboro 等)を対象に含める。.git は常に除外
include_hidden = true

# ハーネス指示文書(AGENTS.md・.oboro/)はである体。文書は敬体
# (設計書 §1.3)。ドッグフーディング常設化(#71)
[style]
target = "plain"

[style.overrides]
"README.md" = "polite"
"docs/**" = "polite"

[detection]
# ハーネス(Claude Code / OpenCode 等)が名前規約で発見するファイルは
# 文書間リンクされないため orphan の対象外にする
orphan_entry_points = [
  "README.md",
  "AGENTS.md",
  "SKILL.md",
]

[lint.rule_excludes]
# 除外が不要になった際は空に保つ(セクションごと消してもよい)
