[package]
name = "jaio-cli"
description = "jaio のバイナリ。サブコマンド体系は設計書 §7.2 を参照"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
oboro-ja-core = { path = "../oboro-ja-core" }
oboro-jaio = { path = "../oboro-jaio" }
rayon = "1.12.0"
serde_json = "1"
sha2 = "0.10"

[features]
# 既定は辞書を埋め込まない軽いビルド(設計書 §6.5)。check / stats / dump は
# jaio.toml の [analysis] dictionary で辞書ディレクトリを受け取る
default = []
embedded-dict = ["oboro-jaio/embedded-dict", "oboro-ja-core/embedded-dict"]

[[bin]]
name = "jaio"
path = "src/main.rs"

[dev-dependencies]
# スキーマ検証専用。HTTP/ファイルの $ref 解決は不要なので絞る
jsonschema = { version = "0.56.0", default-features = false }
# 辞書を使う試験のため、テストビルドだけ辞書を埋め込む
oboro-ja-core = { path = "../oboro-ja-core", features = ["embedded-dict"] }
