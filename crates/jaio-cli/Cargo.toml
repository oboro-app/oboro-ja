[package]
name = "jaio-cli"
description = "jaio のバイナリ。サブコマンド体系は設計書 §7.2 を参照"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
jaio-collect = { path = "../jaio-collect" }
jaio-core = { path = "../jaio-core" }
jaio-index = { path = "../jaio-index" }
jaio-parse = { path = "../jaio-parse", default-features = false }
jaio-report = { path = "../jaio-report" }
jaio-rules = { path = "../jaio-rules", default-features = false }
rayon = "1.12.0"
serde_json = "1"
sha2 = "0.10"

[features]
default = ["embedded-dict"]
embedded-dict = ["jaio-rules/embedded-dict", "jaio-parse/embedded-dict"]

[[bin]]
name = "jaio"
path = "src/main.rs"

[dev-dependencies]
# スキーマ検証専用。HTTP/ファイルの $ref 解決は不要なので絞る
jsonschema = { version = "0.56.0", default-features = false }
