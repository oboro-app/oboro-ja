[package]
name = "oboro-ja"
description = "oboro-ja の入口。JSON 出力と SCHEMA を公開し、組み込み側が依存する唯一の crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
oboro-ja-core = { path = "../oboro-ja-core" }
oboro-jaio = { path = "../oboro-jaio" }

[features]
# 既定は辞書を埋め込まない軽いビルド(設計書 §6.5)
default = []
embedded-dict = ["oboro-jaio/embedded-dict", "oboro-ja-core/embedded-dict"]

[dev-dependencies]
jsonschema = { version = "0.56.0", default-features = false }
serde_json = "1"
# 辞書を使う試験のため、テストビルドだけ辞書を埋め込む
oboro-ja-core = { path = "../oboro-ja-core", features = ["embedded-dict"] }
