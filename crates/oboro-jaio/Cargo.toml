[package]
name = "oboro-jaio"
description = "jaio の診断(ルール・横断索引・出力・コメント抽出)。oboro-ja-core の上に載る"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
comrak = "0.55"
ignore = "0.4"
oboro-ja-core = { path = "../oboro-ja-core", default-features = false }
percent-encoding = "2"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"

[features]
default = ["embedded-dict"]
embedded-dict = ["oboro-ja-core/embedded-dict"]
