[package]
name = "jaio-parse"
description = "文書構造 AST(comrak)と日本語 AST(lindera)の構築"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
comrak = "0.55"
jaio-core = { path = "../jaio-core" }
lindera = { version = "6.0", default-features = true }
# 埋め込み辞書の crate 版を実行時に取得するための直接依存(get_version)。
# lindera/embed-sudachidict 経由の推移依存と同じ版を使う
lindera-sudachidict = { version = "6.0", optional = true }
serde = { version = "1", features = ["derive"] }
tiktoken-rs = "0.12"

[features]
default = ["embedded-dict"]
embedded-dict = ["lindera/embed-sudachidict", "dep:lindera-sudachidict"]
